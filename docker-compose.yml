services:
  api:
    build:
      context: ./backend
    container_name: transforma-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      # O container sobe em UTC por padrao, enquanto o host e o MySQL rodam em
      # America/Sao_Paulo. As datas de inscricao sao gravadas sem fuso ("21/08
      # 19:55" quer dizer 19:55 daqui), e o driver as entrega ao Node usando o
      # fuso do processo -- em UTC, viravam 19:55Z, tres horas adiantadas.
      # Alinhar o container ao banco faz qualquer data lida do MySQL significar
      # o mesmo instante nos dois lados.
      TZ: America/Sao_Paulo
      # Processos da API. O gargalo do sistema e CPU -- bcrypt custa ~147ms para
      # gravar uma senha, medido nesta VPS, e JavaScript roda numa thread so.
      # Com um processo o teto era ~8 logins por segundo e o segundo nucleo
      # ficava parado. Custa ~69 MB por processo.
      #
      # Os limitadores de tentativa leem esta variavel para dividir o limite
      # entre os processos (ver src/shared/concorrencia.js): sem isso, cada
      # processo contaria os seus e o freio valeria o dobro do pretendido.
      WEB_CONCURRENCY: 2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3001"
    networks:
      - transforma-net

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: transforma-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - transforma-net

networks:
  transforma-net:
    driver: bridge
