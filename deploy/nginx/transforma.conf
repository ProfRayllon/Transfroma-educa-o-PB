server {
  server_name transformaeducacaopb.com.br www.transformaeducacaopb.com.br;

  # Padrao do nginx e 1MB, menor que o limite de 5MB que o backend aceita
  # (express.json({ limit: '5mb' })) -- capas de curso/avatares em base64
  # passavam disso e o nginx rejeitava com 413 antes de chegar no backend.
  client_max_body_size 8m;

  # Mesma razao do bloco equivalente em frontend/deploy/nginx/default.conf: a
  # importacao da base passa dos 60s que o nginx espera por padrao, e os DOIS
  # proxies precisam do limite maior -- o mais curto e que manda. Aumentar so
  # aqui, ou so la, nao resolve nada.
  #
  # ATENCAO: este arquivo NAO vai pelo deploy automatico. Ele e a configuracao
  # do nginx do host, aplicada a mao:
  #   sudo cp deploy/nginx/transforma.conf /etc/nginx/sites-available/transforma
  #   sudo nginx -t && sudo systemctl reload nginx
  location = /api/cursistas/admin/cursistas/importar {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
  }

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/transformaeducacaopb.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/transformaeducacaopb.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.transformaeducacaopb.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = transformaeducacaopb.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  server_name transformaeducacaopb.com.br www.transformaeducacaopb.com.br;
    return 404; # managed by Certbot




}
