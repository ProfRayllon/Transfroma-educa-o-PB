server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Padrao do nginx e 1MB, menor que o limite de 5MB que o backend aceita
  # (express.json({ limit: '5mb' })) -- capas de curso/avatares em base64
  # passavam disso e esse nginx (dentro do container do frontend, na frente
  # do proxy_pass para a api) rejeitava com 413 antes de chegar no backend.
  client_max_body_size 8m;

  # A importacao da base grava ~13 mil cadastros e ~16 mil vinculos numa
  # transacao so, e passa dos 60s que o nginx espera por padrao. O corte nao
  # cancelava a gravacao -- ela continua e commita -- mas matava a resposta, e a
  # coordenacao ficava sem saber se a carga entrou. Bloco proprio para o limite
  # maior valer so aqui: no resto da API, 60s continua sendo problema a informar.
  location = /api/cursistas/admin/cursistas/importar {
    proxy_pass http://api:3001/api/cursistas/admin/cursistas/importar;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # Sem bufferizar: o arquivo vai direto para a API em vez de ser escrito em
    # disco temporario antes, o que numa VPS pequena e desperdicio de I/O.
    proxy_request_buffering off;
  }

  location /api/ {
    proxy_pass http://api:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
