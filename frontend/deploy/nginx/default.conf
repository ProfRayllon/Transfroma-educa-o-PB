# Cache das capas de curso, no nginx.
#
# Uma visita ao catalogo baixa ~3,4 MB so de capas, e cada requisicao percorria
# nginx -> api -> consulta ao MySQL -> decodificacao base64 (as capas sao data
# URIs no banco) -> envio. O cache de 24h que a rota manda e do NAVEGADOR: ajuda
# quem volta, mas cada visitante novo pagava o caminho inteiro. Com treze mil
# pessoas isso seriam ~100 mil decodificacoes.
#
# Guardado aqui, o segundo visitante ja e servido pelo nginx, sem tocar no Node
# nem no banco. E seguro porque a URL carrega `?v=<updated_at>`: trocar a capa
# muda o endereco e invalida a entrada sozinha, sem ninguem limpar cache.
#
# 50 MB de teto para ~3,4 MB de conteudo -- folga para varias versoes das capas.
proxy_cache_path /var/cache/nginx/capas levels=1:2 keys_zone=capas:5m
                 max_size=50m inactive=7d use_temp_path=off;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Padrao do nginx e 1MB, menor que o limite de 5MB que o backend aceita
  # (express.json({ limit: '5mb' })) -- capas de curso/avatares em base64
  # passavam disso e esse nginx (dentro do container do frontend, na frente
  # do proxy_pass para a api) rejeitava com 413 antes de chegar no backend.
  client_max_body_size 8m;

  # A importacao da base grava ~13 mil cadastros e ~16 mil vinculos numa
  # transacao so, e passa dos 60s que o nginx espera por padrao. O corte nao
  # cancelava a gravacao -- ela continua e commita -- mas matava a resposta, e a
  # coordenacao ficava sem saber se a carga entrou. Bloco proprio para o limite
  # maior valer so aqui: no resto da API, 60s continua sendo problema a informar.
  location = /api/cursistas/admin/cursistas/importar {
    proxy_pass http://api:3001/api/cursistas/admin/cursistas/importar;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # Sem bufferizar: o arquivo vai direto para a API em vez de ser escrito em
    # disco temporario antes, o que numa VPS pequena e desperdicio de I/O.
    proxy_request_buffering off;
  }

  # Capas de curso: mesma rota da API, servida do cache quando possivel.
  # `$uri$is_args$args` na chave inclui o `?v=`, entao capa nova nunca vem da
  # entrada antiga. `updating` e `error` deixam o nginx servir a copia guardada
  # enquanto a API responde devagar ou esta reiniciando -- num deploy, o catalogo
  # continua com as imagens no lugar.
  location ~ ^/api/publico/cursos/[0-9]+/imagem$ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache capas;
    proxy_cache_key "$uri$is_args$args";
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    add_header X-Cache-Capa $upstream_cache_status always;
  }

  location /api/ {
    proxy_pass http://api:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Arquivo que nao existe precisa responder 404, e nao o site.
  #
  # O `try_files ... /index.html` abaixo e o que faz uma aplicacao de pagina
  # unica funcionar: qualquer caminho cai no index.html e o roteador do navegador
  # decide a tela. So que a regra valia para TUDO -- inclusive para um PDF que
  # nao esta no servidor.
  #
  # O resultado era pior do que um erro: /guias/GUIA_CURSISTA_TRANSFORMA_2026.pdf
  # respondia 200 com o HTML do site, e o link com `download` salvava esse HTML
  # com o nome do PDF. A pessoa baixava um arquivo que abria em branco, sem
  # nenhum sinal de que o arquivo nunca existiu.
  #
  # Extensao de documento ou midia agora responde o arquivo ou 404, nunca o site.
  # `.js` e `.css` ficam de fora de proposito: sao gerados pelo build, sempre
  # existem, e mexer em como eles sao servidos teria alcance sobre a aplicacao
  # inteira sem resolver nada.
  location ~* \.(pdf|zip|rar|docx?|xlsx?|pptx?|csv|txt|png|jpe?g|gif|svg|webp|ico|mp4|webm|mp3|woff2?|ttf|eot)$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
